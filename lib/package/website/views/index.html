<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Login</title>
  <link rel="icon" type="image/x-icon" href="" id="favicon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
</head>
<body class="page-index">

<div class="phero">
  <canvas class="phero-bg" id="ghostFibersCanvas"></canvas>
  <div class="phero-inner">
    <div class="phero-badge" id="phero-badge">
      <span class="phero-badge-item">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span id="phero-badge-uptime">—</span>
      </span>
      <span class="phero-badge-item">
        <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span id="phero-badge-users">—</span>
      </span>
    </div>

    <div class="phero-title">
      <span class="accent" id="phero-title-b">Bot</span>
    </div>
    <div class="phero-desc" id="phero-desc">
      Lightweight WhatsApp automation framework with AI agent, VoIP call, and WS Website, Built with Baileys and NodeJS v24+.
    </div>

    <div class="phero-actions">
      <button class="phero-cta" onclick="handleAccountClick()">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        Get Started
      </button>
      <a id="phero-trybot" href="#" target="_blank" rel="noopener" class="phero-link-btn">
        <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span class="plabel">Chat</span>
      </a>
      <a href="https://whatsapp.com/channel/0029VaVJo460bIdoxTVoJY3e" target="_blank" rel="noopener" class="phero-link-btn">
        <svg viewBox="0 0 24 24"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg>
        <span class="plabel">Channel</span>
      </a>
    </div>

    <div class="doc-footer">
      <a href="#" data-enc="aHR0cHM6Ly9naXRodWIuY29tL2hpcm9vc3k=" id="gh-link" target="_blank" rel="noopener" aria-label="Source">
        <svg viewBox="0 0 16 16"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
      </a>
    </div>
  </div>
</div>

<div id="auth-overlay" class="auth-overlay" onclick="closeAuth(event)">
  <div class="container" onclick="event.stopPropagation()">
    <div class="auth-close" onclick="closeAuth()">&times;</div>

    <div class="brand-side">
      <div class="brand-icon">
        <img src="" alt="" draggable="false" oncontextmenu="return false">
      </div>
      <div class="brand-text">
        <div class="brand-title" id="brand-title-modal">&nbsp;</div>
      </div>
    </div>

    <div class="form-side">
      <div class="tabs">
        <div class="tabs-pill">
          <div class="tabs-highlight" id="tabs-highlight"></div>
          <button class="tab-btn active" data-tab="login">Login</button>
          <button class="tab-btn" data-tab="register">Register</button>
        </div>
      </div>

      <div class="panels-wrap" id="panels-wrap">
      <div id="login-panel" class="form-panel active-panel">
        <div id="login-alert" class="alert"></div>
        <div class="input-group panel-card">
          <label>WhatsApp Number</label>
          <div class="input-wrapper">
            <input type="tel" id="login-phone" placeholder="628123456789" inputmode="numeric">
            <svg class="icon-left" viewBox="0 0 24 24">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.574 2.81.7A2 2 0 0 1 22 16.92z"/>
            </svg>
          </div>
        </div>
        <div class="input-group panel-card">
          <label>Password</label>
          <div class="input-wrapper">
            <input type="password" id="login-password" placeholder="••••••••">
            <svg class="icon-left" viewBox="0 0 24 24">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <svg class="toggle-password" viewBox="0 0 24 24" onclick="togglePassword('login-password', this)">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </div>
        </div>
        <button class="btn panel-card" id="login-btn" onclick="doLogin()">Login</button>
        <button type="button" class="btn panel-card btn-discord discord-login-btn" onclick="startDiscordLogin()" style="display:none">Continue with Discord</button>
      </div>

      <div id="register-panel" class="form-panel">
        <div id="register-alert" class="alert"></div>
        <div class="input-group panel-card">
          <label>WhatsApp Number</label>
          <div class="input-wrapper">
            <input type="tel" id="register-phone" placeholder="628123456789" inputmode="numeric">
            <svg class="icon-left" viewBox="0 0 24 24">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.574 2.81.7A2 2 0 0 1 22 16.92z"/>
            </svg>
          </div>
        </div>
        <div class="input-group panel-card">
          <label>Password</label>
          <div class="input-wrapper">
            <input type="password" id="register-password" placeholder="min. 6 characters">
            <svg class="icon-left" viewBox="0 0 24 24">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <svg class="toggle-password" viewBox="0 0 24 24" onclick="togglePassword('register-password', this)">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </div>
        </div>
        <div class="input-group panel-card">
          <label>Confirm Password</label>
          <div class="input-wrapper">
            <input type="password" id="register-password2" placeholder="••••••••">
            <svg class="icon-left" viewBox="0 0 24 24">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
            <svg class="toggle-password" viewBox="0 0 24 24" onclick="togglePassword('register-password2', this)">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </div>
        </div>
        <button class="btn panel-card" id="register-btn" onclick="doRegister()">Register</button>
        <button type="button" class="btn panel-card btn-discord discord-login-btn" onclick="startDiscordLogin()" style="display:none">Continue with Discord</button>
      </div>
      </div>
    </div>
  </div>
</div>

<div id="modal" class="modal-overlay" onclick="closeModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-icon">
      <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="var(--error, #ff4444)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
        <line x1="12" y1="9" x2="12" y2="13"></line>
        <line x1="12" y1="17" x2="12.01" y2="17"></line>
      </svg>
    </div>
    <div class="modal-title">Number Not Found</div>
    <div class="modal-body" id="modal-body">This number is not listed in the database</div>
    <button class="modal-close" onclick="closeModal()">OK</button>
  </div>
</div>

<div id="otp-modal" class="modal-overlay">
  <div class="modal modal-glass" onclick="event.stopPropagation()">
    <div class="modal-icon-glass">
      <svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="9" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path><circle cx="12" cy="15.5" r="1.4" fill="var(--text)" stroke="none"></circle></svg>
    </div>
    <div class="modal-title">Enter Code</div>
    <div class="modal-body" id="otp-modal-body">We sent a 6-digit code to your WhatsApp. Enter it below.</div>
    <input type="text" id="otp-code" class="otp-input otp-input-glass" placeholder="------" maxlength="6" inputmode="numeric" pattern="[0-9]*">
    <div class="alert" id="otp-alert"></div>
    <button class="modal-close modal-close-glass" id="otp-submit-btn" onclick="submitOtp()" style="width:100%;margin-bottom:10px;">Verify</button>
    <button class="otp-resend" id="otp-resend-btn" onclick="resendOtp()">Resend code</button>
  </div>
</div>

<script src="/assets/index-1.js"></script>

<script src="/assets/index-2.js"></script>

<script src="/assets/index-3.js"></script>
<script src="/assets/index-4.js"></script>
</body>
</html>
