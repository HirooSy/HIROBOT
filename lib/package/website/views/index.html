<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Login</title>
  <link rel="icon" type="image/x-icon" href="" id="favicon">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    img {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      -khtml-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      pointer-events: none;
    }

    :root {
      --bg: #0a0a0a;
      --surface: #111111;
      --surface2: #1a1a1a;
      --border: #222222;
      --border2: #2a2a2a;
      --accent: #ffffff;
      --text: #e0e0e0;
      --muted: #666666;
      --error: #ff4444;
      --success: #44ff66;
      --warning: #ffaa44;
      --doc-pink: #e79ce0;
      --doc-green: #7fe0c2;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    body {
      background: var(--bg);
      font-family: var(--font);
      min-height: 100vh;
      padding: 0 0 60px;
    }

    .phero {
      position: relative;
      max-width: 760px;
      margin: 0 auto;
      padding: 56px 20px 40px;
      text-align: center;
      overflow: hidden;
      background: #000000;
      border-radius: 16px;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .phero::before {
      content: "";
      position: absolute;
      top: -120px;
      left: 50%;
      transform: translateX(-50%);
      width: 480px;
      height: 320px;
      background: radial-gradient(ellipse at center, rgba(139,92,246,0.18), rgba(236,72,153,0.10) 45%, transparent 70%);
      pointer-events: none;
      z-index: 0;
      display: none;
    }

    .phero-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      display: block;
    }

    .phero-inner {
      position: relative;
      z-index: 1;
    }

    .phero-title {
      font-size: 52px;
      font-weight: 700;
      letter-spacing: -0.5px;
      line-height: 1.15;
      color: var(--text);
      margin-bottom: 14px;
      word-break: break-word;
    }

    .phero-title .accent {
      color: #ffffff;
    }

    .phero-desc {
      font-size: 11.5px;
      line-height: 1.6;
      color: #ffffff;
      opacity: 0.6;
      max-width: 320px;
      margin: 0 auto 0.5px;
    }

    .phero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      font-size: 12px;
      color: var(--muted);
      margin: 0 0 22px;
    }

    .phero-badge-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 8px;
      color: var(--muted);
      font-weight: 500;
      font-size: 11px;
      letter-spacing: 0.2px;
    }

    .phero-badge-item svg {
      width: 13px;
      height: 13px;
      stroke: var(--muted);
      fill: none;
      stroke-width: 2.2;
      flex: none;
    }

    .phero-badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--success);
      flex: none;
    }

    .phero-actions {
      display: flex;
      flex-direction: row;
      align-items: stretch;
      gap: 10px;
      max-width: 420px;
      margin: 22px auto 0;
      font-size: 13px;
    }

    .phero-cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex: 1.4;
      padding: 13px 18px;
      border-radius: 12px;
      background: #ffffff;
      color: #0a0a0a;
      font-family: var(--font);
      font-weight: 600;
      font-size: 13px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      white-space: nowrap;
    }

    .phero-cta svg {
      width: 15px;
      height: 15px;
      stroke: #0a0a0a;
      fill: none;
      stroke-width: 2.4;
      flex: none;
    }

    .phero-link-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex: 1;
      padding: 13px 14px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), 0 4px 18px rgba(0, 0, 0, 0.25);
      color: #f0f0f0;
      font-weight: 600;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.2s ease, border-color 0.2s ease;
      white-space: nowrap;
    }

    .phero-link-btn:active {
      background: rgba(255, 255, 255, 0.14);
    }

    .phero-link-btn svg {
      width: 15px;
      height: 15px;
      flex: none;
      stroke: #f0f0f0;
      fill: none;
      stroke-width: 2.4;
    }

    @media (max-width: 480px) {
      .phero-title { font-size: 38px; }
      .phero { padding: 44px 16px 32px; }
      .phero-actions { font-size: 12px; }
      .phero-cta, .phero-link-btn { padding: 12px 10px; }
    }

    .topnav {
      max-width: 760px;
      margin: 0 auto;
      display: flex;
      justify-content: flex-end;
      padding: 16px 18px;
    }

    .log-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      background: transparent;
      border: 1px solid var(--border2);
      color: var(--text);
      border-radius: 50%;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .log-btn svg {
      width: 18px;
      height: 18px;
      stroke: var(--text);
      fill: none;
      stroke-width: 2;
    }

    .doc-wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 0 18px;
    }

    .doc-container {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
    }

    .hero {
      position: relative;
      padding: 36px 24px 28px;
      display: flex;
      align-items: flex-start;
      gap: 24px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--border);
    }

    .hero-logo {
      flex: none;
      width: 90px;
      height: 90px;
      border-radius: 16px;
      overflow: hidden;
    }

    .hero-logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .hero-text {
      flex: 1;
      min-width: 220px;
    }

    .hero-title {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--text);
    }

    .hero-sub {
      font-size: 10px;
      letter-spacing: 6px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .hero-desc {
      font-size: 11px;
      line-height: 1.5;
      color: var(--text);
      opacity: 0.85;
      margin-bottom: 14px;
    }

    .hero-badges {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .hero-badges img {
      height: 15px;
      border-radius: 3px;
      pointer-events: auto;
    }

    .hero-nav {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 14px;
    }

    .hero-nav button {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: #ffffff;
      border: none;
      color: #0a0a0a;
      font-family: var(--font);
      font-weight: 700;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .hero-rule {
      height: 1px;
      background: var(--border2);
      width: 100%;
      margin-bottom: 4px;
    }

    .section-slide {
      display: none;
      border-bottom: 1px solid var(--border);
    }

    .section-slide.active {
      display: block;
      animation: fadeUp 0.25s ease;
    }

    .doc-block {
      display: flex;
      flex-wrap: wrap;
    }

    .doc-block + .doc-block {
      border-top: 1px solid var(--border);
    }

    .doc-block-label {
      flex: none;
      width: 130px;
      padding: 20px 16px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 3px;
      color: var(--muted);
      text-transform: uppercase;
      border-right: 1px solid var(--border);
    }

    .doc-block-body {
      flex: 1;
      min-width: 220px;
      padding: 20px 18px;
      font-size: 12px;
      line-height: 1.9;
      color: var(--text);
    }

    .doc-block-body strong {
      display: block;
      margin-bottom: 4px;
      color: var(--text);
    }

    .cmd-count {
      font-size: 12px;
      font-weight: 600;
      color: var(--doc-green);
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }

    .cmd-divider {
      height: 1px;
      background: var(--border);
      margin-bottom: 14px;
    }

    .cmd-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      font-size: 11px;
    }

    .cmd-list span {
      color: var(--text);
      opacity: 0.85;
      padding: 7px 10px;
      border-bottom: 1px solid var(--border);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .cmd-list span:nth-child(odd) {
      border-right: 1px solid var(--border);
    }

    .cmd-list span::before {
      content: "/";
      color: var(--muted);
    }

    @media (min-width: 480px) {
      .cmd-list {
        grid-template-columns: repeat(3, 1fr);
      }
      .cmd-list span:nth-child(odd) {
        border-right: none;
      }
      .cmd-list span:not(:nth-child(3n)) {
        border-right: 1px solid var(--border);
      }
    }

    .code-body {
      line-height: 1.85;
      white-space: normal;
      word-break: break-word;
    }

    .code-wrap {
      position: relative;
      flex: 1;
      min-width: 220px;
    }

    .code-wrap .code-body {
      padding: 20px 44px 20px 18px;
    }

    .copy-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: 6px;
      cursor: pointer;
      z-index: 1;
      -webkit-tap-highlight-color: transparent;
    }

    .copy-btn svg {
      width: 14px;
      height: 14px;
      fill: none;
      stroke: var(--muted);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .copy-btn:active {
      background: var(--border2);
    }

    .copy-btn.copied svg {
      stroke: var(--doc-green);
    }

    .tok-section {
      color: var(--doc-green);
      display: block;
      font-weight: 600;
      opacity: 0.85;
    }

    .tok-comment {
      color: #6a737d;
      display: block;
      font-style: italic;
    }

    .tok-prompt {
      color: #6a737d;
    }

    .tok-cmd {
      color: #82aaff;
      font-weight: 600;
    }

    .tok-arg {
      color: #c3e88d;
    }

    .tok-string {
      color: #c3e88d;
    }

    .tok-key {
      color: #ff8ad8;
      font-weight: 600;
    }

    .tok-prop {
      color: #7fe0c2;
    }

    .tok-number {
      color: #f78c6c;
    }

    .tok-punct {
      color: #8b95a5;
    }

    .doc-footer {
      text-align: center;
      padding: 24px 0;
    }

    .doc-footer a {
      display: inline-flex;
      -webkit-tap-highlight-color: transparent;
    }

    .doc-footer svg {
      width: 22px;
      height: 22px;
      fill: var(--muted);
      transition: fill 0.15s;
    }

    .doc-footer a:active svg {
      fill: var(--text);
    }

    .auth-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.2s ease;
      padding: 16px;
    }

    .auth-overlay.show {
      opacity: 1;
      visibility: visible;
    }

    .container {
      max-width: 480px;
      width: 100%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 20px;
      overflow: hidden;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1), 0 8px 24px rgba(0, 0, 0, 0.5);
      animation: slideUp 0.28s ease;
      position: relative;
    }

    .auth-overlay.closing .container {
      animation: slideDown 0.22s ease forwards;
    }

    .auth-close {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
      z-index: 2;
      -webkit-tap-highlight-color: transparent;
    }

    .brand-side {
      padding: 32px 28px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .brand-icon {
      width: 56px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      overflow: hidden;
      border-radius: 12px;
    }

    .brand-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .brand-title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text);
    }

    .form-side {
      padding: 12px 28px 32px;
    }

    .tabs {
      display: flex;
      justify-content: center;
      margin-bottom: 24px;
    }

    .tabs-pill {
      position: relative;
      display: flex;
      width: 100%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 999px;
      padding: 4px;
    }

    .tabs-highlight {
      position: absolute;
      top: 4px;
      left: 4px;
      width: calc(50% - 4px);
      height: calc(100% - 8px);
      background: #ffffff;
      border-radius: 999px;
      transition: transform 0.25s ease;
      z-index: 0;
    }

    .tab-btn {
      position: relative;
      z-index: 1;
      flex: 1;
      background: transparent;
      border: none;
      padding: 10px 16px;
      font-family: var(--font);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
      cursor: pointer;
      transition: color 0.2s;
      border-radius: 999px;
      -webkit-tap-highlight-color: transparent;
    }

    .tab-btn.active {
      color: #080808;
      color: #080808;
    }

    .form-panel {
      display: none;
    }

    .form-panel.active-panel {
      display: block;
    }

    .panels-wrap {
      position: relative;
      overflow: hidden;
    }

    .panels-wrap.animating .form-panel {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1;
    }

    .panels-wrap.animating .form-panel.active-panel {
      z-index: 2;
    }

    .input-group {
      margin-bottom: 18px;
    }

    .input-group label {
      display: block;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper input {
      width: 100%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 10px;
      padding: 12px 36px 12px 38px;
      font-family: var(--font);
      font-size: 13px;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s;
      -webkit-appearance: none;
      appearance: none;
    }

    .input-wrapper input:focus {
      border-color: rgba(255, 255, 255, 0.3);
    }

    .input-wrapper svg.icon-left {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 15px;
      height: 15px;
      stroke: var(--muted);
      fill: none;
      stroke-width: 1.5;
    }

    .input-wrapper .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      cursor: pointer;
      stroke: var(--muted);
      fill: none;
      stroke-width: 1.5;
      transition: stroke 0.2s;
      z-index: 2;
      -webkit-tap-highlight-color: transparent;
    }

    .input-wrapper .toggle-password:active {
      stroke: var(--text);
    }

    .btn {
      width: 100%;
      background: var(--accent);
      color: #080808;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-family: var(--font);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      cursor: pointer;
      transition: opacity 0.2s;
      margin-top: 10px;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:active {
      opacity: 0.85;
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .alert {
      background: rgba(255,68,68,0.1);
      border: 1px solid rgba(255,68,68,0.2);
      border-radius: 8px;
      padding: 10px;
      font-size: 10px;
      color: var(--error);
      margin-bottom: 16px;
      display: none;
    }

    .alert.show {
      display: block;
    }

    .success-alert {
      background: rgba(68,255,102,0.1);
      border-color: rgba(68,255,102,0.2);
      color: var(--success);
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.2s ease;
    }

    .modal-overlay.show {
      opacity: 1;
      visibility: visible;
    }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 16px;
      padding: 28px 24px;
      max-width: 300px;
      width: 90%;
      text-align: center;
      animation: popIn 0.25s cubic-bezier(0.34,1.56,0.64,1);
    }

    @keyframes popIn {
      from {
        transform: scale(0.88);
        opacity: 0;
      }
      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    @keyframes slideUp {
      from {
        transform: translateY(40px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    @keyframes slideDown {
      from {
        transform: translateY(0);
        opacity: 1;
      }
      to {
        transform: translateY(40px);
        opacity: 0;
      }
    }

    .modal-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }

    .modal-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .modal-body {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .modal-close {
      background: var(--accent);
      color: #080808;
      border: none;
      border-radius: 8px;
      padding: 10px 22px;
      font-size: 10px;
      font-weight: 700;
      font-family: var(--font);
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: opacity 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .modal-close:active {
      opacity: 0.8;
    }

    .otp-input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      font-family: var(--font);
      font-size: 22px;
      letter-spacing: 10px;
      text-align: center;
      color: var(--text);
      outline: none;
      margin-bottom: 14px;
      -webkit-appearance: none;
      appearance: none;
    }

    .otp-input:focus {

<script>
  function showModal(message) {
    const modal = document.getElementById('modal');
    const modalBody = document.getElementById('modal-body');
    modalBody.textContent = message || 'This number is not listed in the database';
    modal.classList.add('show');
  }

  function closeModal() {
    const modal = document.getElementById('modal');
    modal.classList.remove('show');
  }

  function formatPhoneNumber(input) {
    let cleaned = input.value.replace(/\D/g, '');
    input.value = cleaned;
  }
  
  document.addEventListener('DOMContentLoaded', () => {
    const phoneInputs = ['login-phone', 'register-phone'];
    phoneInputs.forEach(id => {
      const input = document.getElementById(id);
      if (input) {
        input.addEventListener('input', function() { formatPhoneNumber(this); });
        input.addEventListener('blur', function() { formatPhoneNumber(this); });
      }
    });
    loadBotName();
  });

  async function loadBotName() {
    try {
      const res = await safeFetch('/api/botInfo')
      const data = await res.json()
      if (data && data.icon) {
        document.getElementById('favicon').href = data.icon
        document.querySelectorAll('.brand-icon img').forEach(img => img.src = data.icon)
      }
      if (data && data.name) {
        document.title = data.name
        document.getElementById('brand-title-modal').textContent = data.name
        document.querySelectorAll('.brand-icon img').forEach(img => img.alt = data.name)
        document.getElementById('phero-title-b').textContent = data.name
      }
      if (data && data.number) {
        document.getElementById('phero-trybot').href = `https://wa.me/${data.number}`
      } else {
        document.getElementById('phero-trybot').style.display = 'none'
      }
      if (typeof data?.uptime === 'number') {
        startUptimeTicker(data.uptime)
      }
      if (typeof data?.totalUsers === 'number') {
        document.getElementById('phero-badge-users').textContent = data.totalUsers.toLocaleString('en-US')
      }
    } catch {}
  }

  function formatUptime(seconds) {
    seconds = Math.floor(seconds)
    const d = Math.floor(seconds / 86400)
    const h = Math.floor((seconds % 86400) / 3600)
    const m = Math.floor((seconds % 3600) / 60)
    const s = seconds % 60

    if (d > 0) return `${d}d ${h}h ${m}m`
    if (h > 0) return `${h}h ${m}m`
    if (m > 0) return `${m}m ${s}s`
    return `${s}s`
  }

  let uptimeBaseSeconds = null
  let uptimeBaseTimestamp = null
  let uptimeTickInterval = null

  function startUptimeTicker(initialSeconds) {
    uptimeBaseSeconds = initialSeconds
    uptimeBaseTimestamp = Date.now()

    if (uptimeTickInterval) clearInterval(uptimeTickInterval)
    uptimeTickInterval = setInterval(() => {
      if (uptimeBaseSeconds === null) return
      const elapsed = (Date.now() - uptimeBaseTimestamp) / 1000
      const el = document.getElementById('phero-badge-uptime')
      if (el) el.textContent = formatUptime(uptimeBaseSeconds + elapsed)
    }, 1000)
  }

  function togglePassword(inputId, iconEl) {
    const input = document.getElementById(inputId);
    if (input.type === 'password') {
      input.type = 'text';
      iconEl.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
    } else {
      input.type = 'password';
      iconEl.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
    }
  }

  async function safeFetch(url, opts = {}) {
    opts.headers = { ...(opts.headers || {}), 'bypass-tunnel-reminder': '1' }
    const res = await fetch(url, opts)
    const contentType = res.headers.get('content-type') || ''
    if (contentType.includes('text/html')) {
      const err = new Error('TUNNEL_INTERSTITIAL')
      err.isTunnelInterstitial = true
      throw err
    }
    return res
  }

  function friendlyFetchError(err) {
    if (err?.isTunnelInterstitial) {
      return 'This link needs a one-time confirmation. Open the site URL directly in a new tab, tap "Click to Continue", then come back and try again.'
    }
    return 'Connection error.'
  }

  function showAlert(panel, message, isError = true) {
    const alertEl = document.getElementById(`${panel}-alert`)
    alertEl.textContent = message
    alertEl.classList.add('show')
    if (!isError) alertEl.classList.add('success-alert')
    setTimeout(() => {
      alertEl.classList.remove('show')
      if (!isError) alertEl.classList.remove('success-alert')
    }, 3000)
  }

  function setLoading(btn, loading) {
    btn.disabled = loading
    btn.textContent = loading ? '...' : (btn.id === 'login-btn' ? 'Login' : 'Register')
  }

  // ============ TAB SWITCH (garage-door slide: current panel up & out, new panel down & in) ============
  let isTabAnimating = false

  function measurePanelHeight(panelEl) {
    const wasDisplay = panelEl.style.display
    const wasPosition = panelEl.style.position
    const wasVisibility = panelEl.style.visibility

    panelEl.style.position = 'absolute'
    panelEl.style.visibility = 'hidden'
    panelEl.style.display = 'block'

    const height = panelEl.scrollHeight

    panelEl.style.display = wasDisplay
    panelEl.style.position = wasPosition
    panelEl.style.visibility = wasVisibility

    return height
  }

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (isTabAnimating) return
      const tab = btn.getAttribute('data-tab')
      const isLogin = tab === 'login'
      const currentPanel = document.getElementById(isLogin ? 'register-panel' : 'login-panel')
      const targetPanel = document.getElementById(isLogin ? 'login-panel' : 'register-panel')

      if (targetPanel.classList.contains('active-panel')) return
      isTabAnimating = true

      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'))
      btn.classList.add('active')
      document.getElementById('tabs-highlight').style.transform = isLogin ? 'translateX(0)' : 'translateX(100%)'
      document.getElementById('login-alert').classList.remove('show')
      document.getElementById('register-alert').classList.remove('show')

      const wrap = document.getElementById('panels-wrap')
      const currentHeight = wrap.offsetHeight
      const targetHeight = measurePanelHeight(targetPanel)

      wrap.classList.add('animating')

      gsap.killTweensOf([currentPanel, targetPanel, wrap])
      gsap.set([currentPanel, targetPanel], { clearProps: 'transform' })
      gsap.set(wrap, { height: currentHeight })
      gsap.set(currentPanel, { y: 0 })

      const tl = gsap.timeline({
        onComplete: () => {
          currentPanel.classList.remove('active-panel')
          gsap.set(currentPanel, { clearProps: 'transform' })
          gsap.set(targetPanel, { clearProps: 'transform' })
          wrap.classList.remove('animating')
          wrap.style.height = 'auto'
          isTabAnimating = false
        }
      })

      // Phase 1: close — current panel slides up and container collapses using the SAME progress driver
      const closeState = { p: 0 }
      tl.to(closeState, {
        p: 1,
        duration: 0.55,
        ease: 'power2.in',
        onUpdate: () => {
          wrap.style.height = ((1 - closeState.p) * currentHeight) + 'px'
          gsap.set(currentPanel, { y: -currentHeight * closeState.p })
        }
      })

      // Swap panels at the fully-closed midpoint
      tl.call(() => {
        targetPanel.classList.add('active-panel')
        gsap.set(targetPanel, { y: -targetHeight })
      })

      // Phase 2: open — new panel slides down and container expands using the SAME progress driver,
      // so the panel's bottom edge (incl. the button) is never clipped ahead of the container's growth
      const openState = { p: 0 }
      tl.to(openState, {
        p: 1,
        duration: 0.35,
        ease: 'power2.out',
        onUpdate: () => {
          wrap.style.height = (openState.p * targetHeight) + 'px'
          gsap.set(targetPanel, { y: -targetHeight * (1 - openState.p) })
        }
      })
    })
  })

  async function checkNumberExists(phone) {
    try {
      const res = await safeFetch('/api/check-number', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone })
      })
      const data = await res.json()
      return data.exists === true
    } catch (err) {
      console.error('Check number error:', err)
      return false
    }
  }

  let otpState = { phone: null, pendingToken: null }
  let otpResendTimer = null

  function openOtpModal(phone, pendingToken) {
    otpState = { phone, pendingToken }
    document.getElementById('otp-code').value = ''
    document.getElementById('otp-alert').classList.remove('show')
    document.getElementById('otp-modal-body').textContent =
      `We sent a 6-digit code to the WhatsApp number ending in ${phone.slice(-4)}. Enter it below.`
    document.getElementById('otp-modal').classList.add('show')
    startOtpResendCooldown()
    setTimeout(() => document.getElementById('otp-code').focus(), 150)
  }

  function closeOtpModal() {
    document.getElementById('otp-modal').classList.remove('show')
    if (otpResendTimer) { clearInterval(otpResendTimer); otpResendTimer = null }
  }

  function startOtpResendCooldown() {
    const btn = document.getElementById('otp-resend-btn')
    let seconds = 60
    btn.disabled = true
    btn.textContent = `Resend code (${seconds}s)`
    if (otpResendTimer) clearInterval(otpResendTimer)
    otpResendTimer = setInterval(() => {
      seconds--
      if (seconds <= 0) {
        clearInterval(otpResendTimer)
        otpResendTimer = null
        btn.disabled = false
        btn.textContent = 'Resend code'
      } else {
        btn.textContent = `Resend code (${seconds}s)`
      }
    }, 1000)
  }

  function showOtpAlert(message) {
    const el = document.getElementById('otp-alert')
    el.textContent = message
    el.classList.add('show')
  }

  async function submitOtp() {
    const code = document.getElementById('otp-code').value.trim()
    const btn = document.getElementById('otp-submit-btn')
    if (!code || code.length !== 6) {
      showOtpAlert('Enter the 6-digit code.')
      return
    }
    btn.disabled = true
    btn.textContent = '...'
    try {
      const res = await safeFetch('/api/verify-otp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone: otpState.phone, pendingToken: otpState.pendingToken, code })
      })
      const data = await res.json()
      if (data.success) {
        localStorage.setItem('token', data.token)
        localStorage.setItem('phone', otpState.phone)
        window.location.href = '/profile'
      } else {
        showOtpAlert(data.message || 'Verification failed.')
      }
    } catch (err) {
      showOtpAlert(friendlyFetchError(err))
    } finally {
      btn.disabled = false
      btn.textContent = 'Verify'
    }
  }

  async function resendOtp() {
    const btn = document.getElementById('otp-resend-btn')
    btn.disabled = true
    try {
      const res = await safeFetch('/api/resend-otp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone: otpState.phone })
      })
      const data = await res.json()
      if (data.success) {
        otpState.pendingToken = data.pendingToken
        showOtpAlert('A new code has been sent.')
        startOtpResendCooldown()
      } else {
        showOtpAlert(data.message || 'Failed to resend code.')
        btn.disabled = false
      }
    } catch (err) {
      showOtpAlert(friendlyFetchError(err))
      btn.disabled = false
    }
  }

  document.getElementById('otp-code')?.addEventListener('keypress', e => {
    if (e.key === 'Enter') submitOtp()
  })

  async function doLogin() {
    let phone = document.getElementById('login-phone').value.trim()
    const password = document.getElementById('login-password').value
    const btn = document.getElementById('login-btn')

    phone = phone.replace(/\D/g, '');
    
    if (!phone || !password) {
      showAlert('login', 'Please fill in all fields.')
      return
    }

    setLoading(btn, true)
    try {
      const res = await safeFetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone, password })
      })
      const data = await res.json()
      if (data.success) {
        openOtpModal(data.phone || phone, data.pendingToken)
      } else {
        showAlert('login', data.message || 'Login failed.')
      }
    } catch (err) {
      showAlert('login', friendlyFetchError(err))
    } finally {
      setLoading(btn, false)
    }
  }

  async function doRegister() {
    let phone = document.getElementById('register-phone').value.trim()
    const password = document.getElementById('register-password').value
    const password2 = document.getElementById('register-password2').value
    const btn = document.getElementById('register-btn')

    phone = phone.replace(/\D/g, '');

    if (!phone || !password || !password2) {
      showAlert('register', 'Please fill in all fields.')
      return
    }
    if (password !== password2) {
      showAlert('register', 'Passwords do not match.')
      return
    }
    if (password.length < 6) {
      showAlert('register', 'Password must be at least 6 characters.')
      return
    }

    setLoading(btn, true)
    try {
      const exists = await checkNumberExists(phone)
      if (!exists) {
        showModal(`Number ${phone} is not listed in the database.\n\nPlease make sure you have used the bot before registering.`)
        setLoading(btn, false)
        return
      }
    } catch (err) {
      showAlert('register', 'Cannot verify number. Please try again.')
      setLoading(btn, false)
      return
    }

    try {
      const res = await safeFetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone, password })
      })
      const data = await res.json()
      if (data.success) {
        openOtpModal(data.phone || phone, data.pendingToken)
      } else {
        showAlert('register', data.message || 'Registration failed.')
      }
    } catch (err) {
      showAlert('register', friendlyFetchError(err))
    } finally {
      setLoading(btn, false)
    }
  }

  document.getElementById('login-password')?.addEventListener('keypress', e => {
    if (e.key === 'Enter') doLogin()
  })
  document.getElementById('register-password2')?.addEventListener('keypress', e => {
    if (e.key === 'Enter') doRegister()
  })
</script>

<script>
(function () {
  const CONFIG = {
    hue: 0,
    hoverIntensity: 1.2,
    rotateOnHover: false,
    forceHoverState: false,
    backgroundColor: '#000000'
  };

  const canvas = document.getElementById('ghostFibersCanvas');
  const wrap = canvas.parentElement;
  const gl = canvas.getContext('webgl', { alpha: true, premultipliedAlpha: false }) ||
             canvas.getContext('experimental-webgl', { alpha: true, premultipliedAlpha: false });

  if (!gl) {
    console.warn('WebGL not supported, Orb background skipped.');
    return;
  }

  gl.clearColor(0, 0, 0, 0);

  const VERT = `
    precision highp float;
    attribute vec2 position;
    attribute vec2 uv;
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = vec4(position, 0.0, 1.0);
    }
  `;

  const FRAG = `
    precision highp float;

    uniform float iTime;
    uniform vec3 iResolution;
    uniform float hue;
    uniform float hover;
    uniform float rot;
    uniform float hoverIntensity;
    uniform vec3 backgroundColor;
    varying vec2 vUv;

    vec3 rgb2yiq(vec3 c) {
      float y = dot(c, vec3(0.299, 0.587, 0.114));
      float i = dot(c, vec3(0.596, -0.274, -0.322));
      float q = dot(c, vec3(0.211, -0.523, 0.312));
      return vec3(y, i, q);
    }

    vec3 yiq2rgb(vec3 c) {
      float r = c.x + 0.956 * c.y + 0.621 * c.z;
      float g = c.x - 0.272 * c.y - 0.647 * c.z;
      float b = c.x - 1.106 * c.y + 1.703 * c.z;
      return vec3(r, g, b);
    }

    vec3 adjustHue(vec3 color, float hueDeg) {
      float hueRad = hueDeg * 3.14159265 / 180.0;
      vec3 yiq = rgb2yiq(color);
      float cosA = cos(hueRad);
      float sinA = sin(hueRad);
      float i = yiq.y * cosA - yiq.z * sinA;
      float q = yiq.y * sinA + yiq.z * cosA;
      yiq.y = i;
      yiq.z = q;
      return yiq2rgb(yiq);
    }

    vec3 hash33(vec3 p3) {
      p3 = fract(p3 * vec3(0.1031, 0.11369, 0.13787));
      p3 += dot(p3, p3.yxz + 19.19);
      return -1.0 + 2.0 * fract(vec3(
        p3.x + p3.y,
        p3.x + p3.z,
        p3.y + p3.z
      ) * p3.zyx);
    }

    float snoise3(vec3 p) {
      const float K1 = 0.333333333;
      const float K2 = 0.166666667;
      vec3 i = floor(p + (p.x + p.y + p.z) * K1);
      vec3 d0 = p - (i - (i.x + i.y + i.z) * K2);
      vec3 e = step(vec3(0.0), d0 - d0.yzx);
      vec3 i1 = e * (1.0 - e.zxy);
      vec3 i2 = 1.0 - e.zxy * (1.0 - e);
      vec3 d1 = d0 - (i1 - K2);
      vec3 d2 = d0 - (i2 - K1);
      vec3 d3 = d0 - 0.5;
      vec4 h = max(0.6 - vec4(
        dot(d0, d0),
        dot(d1, d1),
        dot(d2, d2),
        dot(d3, d3)
      ), 0.0);
      vec4 n = h * h * h * h * vec4(
        dot(d0, hash33(i)),
        dot(d1, hash33(i + i1)),
        dot(d2, hash33(i + i2)),
        dot(d3, hash33(i + 1.0))
      );
      return dot(vec4(31.316), n);
    }

    vec4 extractAlpha(vec3 colorIn) {
      float a = max(max(colorIn.r, colorIn.g), colorIn.b);
      return vec4(colorIn.rgb / (a + 1e-5), a);
    }

    const vec3 baseColor1 = vec3(0.85, 0.85, 0.85);
    const vec3 baseColor2 = vec3(0.55, 0.55, 0.55);
    const vec3 baseColor3 = vec3(0.08, 0.08, 0.08);
    const float innerRadius = 0.6;
    const float noiseScale = 0.65;

    float light1(float intensity, float attenuation, float dist) {
      return intensity / (1.0 + dist * attenuation);
    }
    float light2(float intensity, float attenuation, float dist) {
      return intensity / (1.0 + dist * dist * attenuation);
    }

    vec4 draw(vec2 uv) {
      vec3 color1 = adjustHue(baseColor1, hue);
      vec3 color2 = adjustHue(baseColor2, hue);
      vec3 color3 = adjustHue(baseColor3, hue);

      float ang = atan(uv.y, uv.x);
      float len = length(uv);
      float invLen = len > 0.0 ? 1.0 / len : 0.0;

      float bgLuminance = dot(backgroundColor, vec3(0.299, 0.587, 0.114));

      float n0 = snoise3(vec3(uv * noiseScale, iTime * 0.5)) * 0.5 + 0.5;
      float r0 = mix(mix(innerRadius, 1.0, 0.4), mix(innerRadius, 1.0, 0.6), n0);
      float d0 = distance(uv, (r0 * invLen) * uv);
      float v0 = light1(1.0, 10.0, d0);

      v0 *= smoothstep(r0 * 1.05, r0, len);
      float innerFade = smoothstep(r0 * 0.8, r0 * 0.95, len);
      v0 *= mix(innerFade, 1.0, bgLuminance * 0.7);
      float cl = cos(ang + iTime * 2.0) * 0.5 + 0.5;

      float a = iTime * -1.0;
      vec2 pos = vec2(cos(a), sin(a)) * r0;
      float d = distance(uv, pos);
      float v1 = light2(1.5, 5.0, d);
      v1 *= light1(1.0, 50.0, d0);

      float v2 = smoothstep(1.0, mix(innerRadius, 1.0, n0 * 0.5), len);
      float v3 = smoothstep(innerRadius, mix(innerRadius, 1.0, 0.5), len);

      vec3 colBase = mix(color1, color2, cl);
      float fadeAmount = mix(1.0, 0.1, bgLuminance);

      vec3 darkCol = mix(color3, colBase, v0);
      darkCol = (darkCol + v1) * v2 * v3;
      darkCol = clamp(darkCol, 0.0, 1.0);

      vec3 lightCol = (colBase + v1) * mix(1.0, v2 * v3, fadeAmount);
      lightCol = mix(backgroundColor, lightCol, v0);
      lightCol = clamp(lightCol, 0.0, 1.0);

      vec3 finalCol = mix(darkCol, lightCol, bgLuminance);

      return extractAlpha(finalCol);
    }

    vec4 mainImage(vec2 fragCoord) {
      vec2 center = iResolution.xy * 0.5;
      float size = min(iResolution.x, iResolution.y);
      vec2 uv = (fragCoord - center) / size * 2.0;

      float angle = rot;
      float s = sin(angle);
      float c = cos(angle);
      uv = vec2(c * uv.x - s * uv.y, s * uv.x + c * uv.y);

      uv.x += hover * hoverIntensity * 0.1 * sin(uv.y * 10.0 + iTime);
      uv.y += hover * hoverIntensity * 0.1 * sin(uv.x * 10.0 + iTime);

      return draw(uv);
    }

    void main() {
      vec2 fragCoord = vUv * iResolution.xy;
      vec4 col = mainImage(fragCoord);
      gl_FragColor = vec4(col.rgb * col.a, col.a);
    }
  `;

  function compile(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      console.error(gl.getShaderInfoLog(s));
    }
    return s;
  }

  const program = gl.createProgram();
  gl.attachShader(program, compile(gl.VERTEX_SHADER, VERT));
  gl.attachShader(program, compile(gl.FRAGMENT_SHADER, FRAG));
  gl.linkProgram(program);
  gl.useProgram(program);

  const positions = new Float32Array([-1, -1, 3, -1, -1, 3]);
  const uvs = new Float32Array([0, 0, 2, 0, 0, 2]);

  const positionBuffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
  gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STATIC_DRAW);
  const positionLoc = gl.getAttribLocation(program, 'position');
  gl.enableVertexAttribArray(positionLoc);
  gl.vertexAttribPointer(positionLoc, 2, gl.FLOAT, false, 0, 0);

  const uvBuffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, uvBuffer);
  gl.bufferData(gl.ARRAY_BUFFER, uvs, gl.STATIC_DRAW);
  const uvLoc = gl.getAttribLocation(program, 'uv');
  gl.enableVertexAttribArray(uvLoc);
  gl.vertexAttribPointer(uvLoc, 2, gl.FLOAT, false, 0, 0);

  const U = {
    iTime: gl.getUniformLocation(program, 'iTime'),
    iResolution: gl.getUniformLocation(program, 'iResolution'),
    hue: gl.getUniformLocation(program, 'hue'),
    hover: gl.getUniformLocation(program, 'hover'),
    rot: gl.getUniformLocation(program, 'rot'),
    hoverIntensity: gl.getUniformLocation(program, 'hoverIntensity'),
    backgroundColor: gl.getUniformLocation(program, 'backgroundColor')
  };

  function hexToVec3(color) {
    if (color.startsWith('#')) {
      const r = parseInt(color.slice(1, 3), 16) / 255;
      const g = parseInt(color.slice(3, 5), 16) / 255;
      const b = parseInt(color.slice(5, 7), 16) / 255;
      return [r, g, b];
    }
    return [0, 0, 0];
  }

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    const width = wrap.clientWidth;
    const height = wrap.clientHeight;
    canvas.width = Math.max(1, Math.floor(width * dpr));
    canvas.height = Math.max(1, Math.floor(height * dpr));
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.uniform3f(U.iResolution, canvas.width, canvas.height, canvas.width / canvas.height);
  }

  const ro = new ResizeObserver(resize);
  ro.observe(wrap);
  window.addEventListener('resize', resize);
  resize();

  let targetHover = 0;

  let lastTime = 0;
  let currentRot = 0;
  let hoverValue = 0;
  const rotationSpeed = 0.3;

  function update(t) {
    requestAnimationFrame(update);
    const dt = (t - lastTime) * 0.001;
    lastTime = t;

    gl.uniform1f(U.iTime, t * 0.001);
    gl.uniform1f(U.hue, CONFIG.hue);
    gl.uniform1f(U.hoverIntensity, CONFIG.hoverIntensity);
    const bg = hexToVec3(CONFIG.backgroundColor);
    gl.uniform3f(U.backgroundColor, bg[0], bg[1], bg[2]);

    const effectiveHover = CONFIG.forceHoverState ? 1 : targetHover;
    hoverValue += (effectiveHover - hoverValue) * 0.1;
    gl.uniform1f(U.hover, hoverValue);

    if (CONFIG.rotateOnHover && effectiveHover > 0.5) {
      currentRot += dt * rotationSpeed;
    }
    gl.uniform1f(U.rot, currentRot);

    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  requestAnimationFrame(update);
})();
</script>
